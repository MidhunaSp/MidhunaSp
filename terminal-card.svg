      <text x="32" y="296" fill="#8FB8F6" font-weight="bold">Stack</text>

      <text x="32" y="326" fill="#3DDC97">Backend</text>
      <text x="220" y="326" fill="#C9D1E8">Python · FastAPI · Streamlit</text>

      <text x="32" y="356" fill="#3DDC97">AI / ML</text>
      <text x="220" y="356" fill="#C9D1E8">RAG · ChromaDB · sentence-transformers · LLM APIs</text>

      <text x="32" y="386" fill="#3DDC97">Tools</text>
      <text x="220" y="386" fill="#C9D1E8">Git · GitHub · VS Code</text>

      <line x1="32" y1="404" x2="868" y2="404" stroke="#232A55" stroke-width="1"/>

      <text x="32" y="434" fill="#7D8AB8">$</text>
      <text x="50" y="434" fill="#E6EDF3">echo "always building, always learning" </text>
      <rect x="500" y="422" width="10" height="16" fill="#3DDC97"/>
