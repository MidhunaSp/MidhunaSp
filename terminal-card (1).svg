<svg viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12163A"/>
      <stop offset="100%" stop-color="#0B0E24"/>
    </linearGradient>
    <clipPath id="roundedWindow">
      <rect x="0" y="0" width="900" height="490" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedWindow)">
    <rect x="0" y="0" width="900" height="490" fill="url(#bgGrad)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="42" fill="#161B3D"/>
    <circle cx="26" cy="21" r="7" fill="#FF5F56"/>
    <circle cx="48" cy="21" r="7" fill="#FFBD2E"/>
    <circle cx="70" cy="21" r="7" fill="#27C93F"/>
    <text x="450" y="26" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7D8AB8">midhuna@github: ~$ whoami</text>

    <!-- prompt line -->
    <text x="32" y="76" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#3DDC97">midhuna@github</text>
    <text x="186" y="76" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#7D8AB8">:</text>
    <text x="194" y="76" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8FB8F6">~</text>
    <text x="212" y="76" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#E6EDF3">$ neofetch --whoami</text>

    <line x1="32" y1="94" x2="868" y2="94" stroke="#232A55" stroke-width="1"/>

    <!-- section: identity -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="15">
      <text x="32" y="126" fill="#FFB86B" font-weight="bold">Name</text>
      <text x="220" y="126" fill="#E6EDF3">Midhuna Varshini</text>

      <text x="32" y="156" fill="#FFB86B" font-weight="bold">Status</text>
      <text x="220" y="156" fill="#E6EDF3">Final Year Engineering Student</text>

      <text x="32" y="186" fill="#FFB86B" font-weight="bold">Focus</text>
      <text x="220" y="186" fill="#E6EDF3">Full Stack Development &amp; Generative AI</text>

      <text x="32" y="216" fill="#FFB86B" font-weight="bold">Exploring</text>
      <text x="220" y="216" fill="#E6EDF3">AI · Machine Learning · Cloud Computing</text>

      <text x="32" y="246" fill="#FFB86B" font-weight="bold">Goal</text>
      <text x="220" y="246" fill="#E6EDF3">To become a skilled software developer</text>

      <line x1="32" y1="264" x2="868" y2="264" stroke="#232A55" stroke-width="1"/>

      <!-- stack -->
      <text x="32" y="296" fill="#8FB8F6" font-weight="bold">Stack</text>

      <text x="32" y="326" fill="#3DDC97">Languages</text>
      <text x="220" y="326" fill="#C9D1E8">Python · Java · JavaScript · SQL</text>

      <text x="32" y="356" fill="#3DDC97">Frontend</text>
      <text x="220" y="356" fill="#C9D1E8">React.js · Angular · HTML · CSS</text>

      <text x="32" y="386" fill="#3DDC97">Backend / DB</text>
      <text x="220" y="386" fill="#C9D1E8">Node.js · Express.js · FastAPI · MongoDB · MySQL</text>

      <text x="32" y="416" fill="#3DDC97">GenAI</text>
      <text x="220" y="416" fill="#C9D1E8">LLMs · RAG · ChromaDB · Embeddings · Streamlit</text>

      <line x1="32" y1="434" x2="868" y2="434" stroke="#232A55" stroke-width="1"/>

      <text x="32" y="464" fill="#7D8AB8">$</text>
      <text x="50" y="464" fill="#E6EDF3">echo "keep learning, keep building"</text>
      <rect x="470" y="452" width="10" height="16" fill="#3DDC97"/>
    </g>
  </g>
</svg>
